<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyberpunk Portals · CodePen 2.0</title>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --portal-x: 50vw;
      --portal-y: 50vh;
      --portal-radius: 170px;
      --parallax-x: 0px;
      --parallax-y: 0px;
      --cursor-x: 50vw;
      --cursor-y: 50vh;
      --trail-opacity: 0;
      --day-sky-top: #e2eef8;
      --day-sky-mid: #c4d8ec;
      --day-sky-horizon: #f0e6d6;
      --day-bldg-base: #f5f8fb;
      --day-bldg-shadow: rgba(120, 140, 165, 0.25);
      --day-ground: #e6dccc;
      --day-accent: #c8a87c;
      --night-sky-top: #040412;
      --night-sky-mid: #0d0828;
      --night-sky-horizon: #08081a;
      --night-bldg-base: #0b0b1e;
      --night-bldg-shadow: rgba(0, 0, 0, 0.7);
      --night-ground: #060612;
      --neon-pink: #ff2d85;
      --neon-cyan: #00e5ff;
      --neon-purple: #b347ea;
      --neon-gold: #ffb830;
      --neon-blue: #4a7aff;
      --portal-outer: #ff2d85;
      --portal-mid: #b347ea;
      --portal-inner: #00e5ff;
      --glass-bg: rgba(12, 12, 35, 0.60);
      --glass-border: rgba(255, 255, 255, 0.10);
      --glass-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 1024px) {
      :root { --portal-radius: 130px; }
    }
    @media (max-width: 768px) {
      :root { --portal-radius: 90px; }
    }
    @media (max-width: 480px) {
      :root { --portal-radius: 70px; }
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      cursor: crosshair;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
    }

    /* ----- universe layers ----- */
    #universe {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: 0;
      display: flex;
      width: 100%;
      height: 100%;
    }
    .layer.base { z-index: 1; }
    .layer.lens {
      z-index: 2;
      clip-path: circle(var(--portal-radius) at var(--portal-x) var(--portal-y));
      pointer-events: none;
      transition: clip-path 0.05s ease-out;
      will-change: clip-path;
    }

    .half {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ----- day theme ----- */
    .theme-day {
      background: linear-gradient(180deg,
          var(--day-sky-top) 0%,
          var(--day-sky-mid) 40%,
          var(--day-sky-horizon) 72%,
          #f5ede0 100%);
    }
    .sky-day {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 30% 12%, rgba(255, 245, 220, 0.55), transparent 55%),
        radial-gradient(ellipse at 70% 20%, rgba(220, 235, 255, 0.25), transparent 40%);
    }
    .sun {
      position: absolute;
      top: 11%;
      left: 32%;
      width: 92px;
      height: 92px;
      background: radial-gradient(circle at 30% 25%, #fffcf0, #ffe8b8 25%, #ffd48a 55%, transparent 72%);
      border-radius: 50%;
      z-index: 1;
      box-shadow:
        0 0 60px 20px rgba(255, 210, 130, 0.5),
        0 0 130px 45px rgba(255, 200, 120, 0.30),
        0 0 200px 60px rgba(255, 180, 100, 0.12);
      animation: sunGlow 6s ease-in-out infinite;
      transform: translate(calc(var(--parallax-x) * 0.5), calc(var(--parallax-y) * 0.5));
    }
    @keyframes sunGlow {
      0%, 100% { box-shadow: 0 0 60px 20px rgba(255, 210, 130, 0.5), 0 0 130px 45px rgba(255, 200, 120, 0.30); }
      50% { box-shadow: 0 0 80px 28px rgba(255, 220, 140, 0.6), 0 0 150px 55px rgba(255, 210, 130, 0.35); }
    }

    /* clouds */
    .clouds {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      transform: translate(calc(var(--parallax-x) * 0.2), calc(var(--parallax-y) * 0.12));
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.80);
      border-radius: 50%;
      box-shadow: 0 0 50px 12px rgba(255, 255, 255, 0.30), 0 8px 30px rgba(160, 175, 200, 0.12);
      filter: blur(0.4px);
      will-change: transform;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
      box-shadow: inherit;
    }
    .c1 { width: 140px; height: 44px; top: 16%; left: 18%; animation: cloudDrift1 34s linear infinite; }
    .c1::before { width: 62%; height: 150%; top: -55%; left: 6%; }
    .c1::after { width: 44%; height: 125%; top: -42%; left: 52%; }
    .c2 { width: 90px; height: 30px; top: 24%; left: 52%; animation: cloudDrift2 28s linear infinite; opacity: 0.70; }
    .c2::before { width: 58%; height: 145%; top: -52%; left: 8%; }
    .c2::after { width: 40%; height: 115%; top: -38%; left: 54%; }
    .c3 { width: 110px; height: 36px; top: 30%; left: 8%; animation: cloudDrift3 40s linear infinite; opacity: 0.50; }
    .c3::before { width: 55%; height: 135%; top: -48%; left: 5%; }
    .c3::after { width: 40%; height: 110%; top: -36%; left: 55%; }
    .c4 { width: 75px; height: 26px; top: 10%; left: 72%; animation: cloudDrift1 26s linear infinite reverse; opacity: 0.45; }
    .c4::before { width: 60%; height: 140%; top: -50%; left: 6%; }
    .c4::after { width: 38%; height: 112%; top: -36%; left: 56%; }
    @keyframes cloudDrift1 { 0% { transform: translateX(0); } 50% { transform: translateX(80px); } 100% { transform: translateX(0); } }
    @keyframes cloudDrift2 { 0% { transform: translateX(0); } 50% { transform: translateX(-60px); } 100% { transform: translateX(0); } }
    @keyframes cloudDrift3 { 0% { transform: translateX(0); } 50% { transform: translateX(100px); } 100% { transform: translateX(0); } }

    .bd1::before { content: ''; position: absolute; top: 18%; left: 15%; width: 22%; height: 18%; background: rgba(200,215,230,0.35); border-radius: 2px; box-shadow: 0 0 0 1px rgba(180,195,215,0.25); }
    .bd1a { left: 14.5%; width: 5.5%; height: 30%; z-index: 4; background: linear-gradient(105deg, #e2e9f0, #f4f8fc); box-shadow: 0 2px 10px rgba(100,120,145,0.18), inset -4px 0 10px rgba(150,165,185,0.15); border-radius: 3px 3px 0 0; }
    .bd2 { left: 21%; width: 9%; height: 36%; z-index: 5; background: linear-gradient(105deg, #e6ecf3, #f7fafd, #dee5ed); box-shadow: 0 3px 12px rgba(100,120,145,0.20), inset -6px 0 14px rgba(150,165,185,0.18); border-radius: 4px 4px 0 0; }

    .bd5::after { content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 4px; height: 30px; background: var(--day-accent); border-radius: 2px; box-shadow: 0 0 6px rgba(200,168,124,0.5); }
    .bd6 { left: 81%; width: 9%; height: 28%; z-index: 4; background: linear-gradient(105deg, #e4eaf1, #f5f8fc); box-shadow: 0 2px 10px rgba(100,120,145,0.16), inset -4px 0 10px rgba(150,165,185,0.14); border-radius: 3px 3px 0 0; }
    .bd7 { left: 91%; width: 7%; height: 20%; z-index: 3; background: linear-gradient(105deg, #e0e7ee, #f2f6fa); opacity: 0.85; box-shadow: 0 2px 8px rgba(100,120,145,0.12); border-radius: 2px 2px 0 0; }
    .ground-day {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12%;
      background: linear-gradient(180deg, #e6dccc, #d4cabc);
      z-index: 4;
      box-shadow: inset 0 8px 20px rgba(160,145,120,0.20);
    }
    .particles-day {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(2px 2px at 18% 35%, rgba(200,175,130,0.6), transparent),
        radial-gradient(1.8px 1.8px at 32% 52%, rgba(210,185,140,0.5), transparent),

      animation: particleFloat 9s ease-in-out infinite;
    }
    @keyframes particleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-18px) scale(1.05); opacity: 1; }
    }

    /* ----- night theme ----- */
    .theme-night {
      background: linear-gradient(180deg,
          var(--night-sky-top) 0%,
          var(--night-sky-mid) 35%,
          #0f0f28 65%,
          var(--night-sky-horizon) 100%);

    .sky-night {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 65% 10%, rgba(70, 50, 130, 0.40), transparent 55%),

    .moon {
      position: absolute;
      top: 9%;
      right: 22%;
      width: 58px;
      height: 58px;
      background: radial-gradient(circle at 40% 32%, #f4f4ff, #d4d4ec 50%, #9090b8);

    @keyframes moonGlow {

      50% { box-shadow: 0 0 55px 20px rgba(195,195,240,0.55), 0 0 110px 45px rgba(160,160,220,0.30); }
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: 1;

    }
    .stars-layer {

      inset: 0;

    .stars-layer-1 {

    .bn5::before { content: ''; position: absolute; top: 12px; right: 10px; width: 28px; height: 10px; background: var(--neon-cyan); box-shadow: 0 0 14px var(--neon-cyan), 0 0 28px var(--neon-cyan); border-radius: 3px; animation: neonSignPulse 2.2s ease-in-out infinite; }
    .bn5::after { content: ''; position: absolute; inset: 9px; background:
        radial-gradient(1.8px 1.8px at 18% 18%, var(--neon-cyan), transparent),
        radial-gradient(1.8px 1.8px at 42% 48%, var(--neon-purple), transparent),
        radial-gradient(1.8px 1.8px at 68% 28%, var(--neon-cyan), transparent),
        radial-gradient(1.8px 1.8px at 28% 72%, var(--neon-pink), transparent),
        radial-gradient(1.8px 1.8px at 58% 82%, var(--neon-cyan), transparent);
      animation: windowFlicker 3.4s ease-in-out infinite 0.4s;
    }
    .bn6 {
      left: 81%; width: 9%; height: 28%; z-index: 4;
      background: linear-gradient(105deg, #0a0a1c, #121230);
      box-shadow: 0 0 10px rgba(179,71,234,0.18), inset -4px 0 12px rgba(0,0,0,0.5);
      border-color: rgba(179,71,234,0.20);
      border-radius: 3px 3px 0 0;
    }
    .bn6::after { content: ''; position: absolute; inset: 6px; background: radial-gradient(1.4px 1.4px at 32% 28%, var(--neon-purple), transparent), radial-gradient(1.4px 1.4px at 62% 58%, var(--neon-cyan), transparent); animation: windowFlicker 2.4s ease-in-out infinite 1.0s; }
    .bn7 {
      left: 91%; width: 7%; height: 20%; z-index: 3;
      background: linear-gradient(105deg, #08081a, #10102a);
      box-shadow: 0 0 8px rgba(255,45,133,0.12), inset -2px 0 8px rgba(0,0,0,0.4);
      border-color: rgba(255,45,133,0.15);
      opacity: 0.9;
      border-radius: 2px 2px 0 0;
    }
    @keyframes windowFlicker {
      0%, 100% { opacity: 0.75; }
      20% { opacity: 1; }
      45% { opacity: 0.50; }
      60% { opacity: 0.95; }
      78% { opacity: 0.60; }
      90% { opacity: 1; }
    }
    @keyframes neonSignPulse {
      0%, 100% { box-shadow: 0 0 14px var(--neon-cyan), 0 0 28px var(--neon-cyan); }
      50% { box-shadow: 0 0 24px var(--neon-cyan), 0 0 48px var(--neon-cyan), 0 0 70px rgba(0,229,255,0.30); }
    }
    .ground-night {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12%;
      background: linear-gradient(180deg, #08081a, #040412);
      z-index: 4;
      border-top: 1px solid rgba(255,45,133,0.25);
      box-shadow: 0 -4px 30px rgba(255,45,133,0.12), inset 0 8px 20px rgba(179,71,234,0.06);
    }

    /* neon rain */
    .neon-rain {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    .rain-drop {
      position: absolute;
      top: -6%;
      width: 1.8px;
      background: linear-gradient(180deg, transparent 0%, var(--neon-cyan) 25%, rgba(255,255,255,0.95) 50%, var(--neon-cyan) 75%, transparent 100%);
      animation: rainFall linear infinite;
      opacity: 0;
      box-shadow: 0 0 6px rgba(0,229,255,0.7);
      border-radius: 2px;
      will-change: transform, opacity;
    }
    .rain-drop::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -3px;
      width: 6px;
      height: 6px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(0,229,255,0.9), transparent 70%);
      border-radius: 50%;
      filter: blur(0.5px);
    }
    .rain-drop:nth-child(1) { left: 6%; height: 42px; animation-duration: 1.6s; }
    .rain-drop:nth-child(2) { left: 14%; height: 28px; animation-duration: 1.9s; animation-delay: 0.3s; background: linear-gradient(180deg, transparent, var(--neon-pink), rgba(255,255,255,0.95), var(--neon-pink), transparent); box-shadow: 0 0 6px rgba(255,45,133,0.7); }
    .rain-drop:nth-child(3) { left: 24%; height: 34px; animation-duration: 1.4s; animation-delay: 0.1s; }
    .rain-drop:nth-child(4) { left: 34%; height: 24px; animation-duration: 2.1s; animation-delay: 0.6s; background: linear-gradient(180deg, transparent, var(--neon-purple), rgba(255,255,255,0.90), var(--neon-purple), transparent); box-shadow: 0 0 6px rgba(179,71,234,0.6); }
    .rain-drop:nth-child(5) { left: 44%; height: 36px; animation-duration: 1.7s; animation-delay: 0.5s; }
    .rain-drop:nth-child(6) { left: 54%; height: 22px; animation-duration: 1.5s; animation-delay: 0.8s; background: linear-gradient(180deg, transparent, var(--neon-purple), rgba(255,255,255,0.85), var(--neon-purple), transparent); box-shadow: 0 0 5px rgba(179,71,234,0.5); }
    .rain-drop:nth-child(7) { left: 64%; height: 30px; animation-duration: 2.0s; animation-delay: 0.2s; }
    .rain-drop:nth-child(8) { left: 74%; height: 20px; animation-duration: 1.3s; animation-delay: 1.0s; background: linear-gradient(180deg, transparent, var(--neon-pink), rgba(255,255,255,0.90), var(--neon-pink), transparent); box-shadow: 0 0 5px rgba(255,45,133,0.5); }
    .rain-drop:nth-child(9) { left: 84%; height: 32px; animation-duration: 1.85s; animation-delay: 0.35s; }
    .rain-drop:nth-child(10) { left: 93%; height: 24px; animation-duration: 1.55s; animation-delay: 0.75s; background: linear-gradient(180deg, transparent, var(--neon-blue), rgba(255,255,255,0.85), var(--neon-blue), transparent); box-shadow: 0 0 5px rgba(74,122,255,0.5); }
    .rain-drop:nth-child(11) { left: 18%; height: 26px; animation-duration: 1.8s; animation-delay: 1.2s; background: linear-gradient(180deg, transparent, var(--neon-gold), rgba(255,255,255,0.85), var(--neon-gold), transparent); box-shadow: 0 0 5px rgba(255,184,48,0.4); }
    .rain-drop:nth-child(12) { left: 48%; height: 28px; animation-duration: 1.65s; animation-delay: 0.9s; background: linear-gradient(180deg, transparent, var(--neon-blue), rgba(255,255,255,0.85), var(--neon-blue), transparent); box-shadow: 0 0 5px rgba(74,122,255,0.5); }
    .rain-drop:nth-child(13) { left: 78%; height: 22px; animation-duration: 1.45s; animation-delay: 1.4s; background: linear-gradient(180deg, transparent, var(--neon-gold), rgba(255,255,255,0.80), var(--neon-gold), transparent); box-shadow: 0 0 4px rgba(255,184,48,0.4); }
    .rain-drop:nth-child(14) { left: 3%; height: 30px; animation-duration: 1.95s; animation-delay: 0.15s; }
    .rain-drop:nth-child(15) { left: 56%; height: 34px; animation-duration: 1.75s; animation-delay: 0.55s; background: linear-gradient(180deg, transparent, var(--neon-pink), rgba(255,255,255,0.95), var(--neon-pink), transparent); box-shadow: 0 0 6px rgba(255,45,133,0.6); }
    @keyframes rainFall {
      0% { transform: translateY(-10%); opacity: 0; }
      6% { opacity: 0.95; }
      85% { opacity: 0.35; }
      100% { transform: translateY(105vh); opacity: 0; }
    }

    /* city silhouette & watermark */
    .city-silhouette {
      position: absolute;
      bottom: 38%;
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      font-size: clamp(4rem, 10vw, 8rem);
      color: rgba(255,255,255,0.04);
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 24px;
      z-index: 0;
      user-select: none;
    }
    .watermark {
      position: absolute;
      bottom: 16%;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 900;
      color: rgba(180,160,140,0.06);
      z-index: 2;
      pointer-events: none;
      letter-spacing: -0.04em;
      user-select: none;
    }
    .theme-night .watermark {
      color: rgba(255,45,133,0.05);
      text-shadow: 0 0 50px rgba(255,45,133,0.08);
    }

    /* divider */
    .divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.12), rgba(200,200,230,0.25), rgba(255,255,255,0.12), transparent);
      box-shadow: 0 0 8px rgba(150,150,210,0.15);
      z-index: 2;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* portal decor */
    .portal-decor {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      z-index: 10;
      pointer-events: none;
      transform: translate(var(--portal-x), var(--portal-y));
      will-change: transform;
    }
    .portal-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .ring-outer {
      width: calc(var(--portal-radius) * 2 + 28px);
      height: calc(var(--portal-radius) * 2 + 28px);
      border: 5px solid transparent;
      z-index: 1;
    }
    .ring-glow-rotate {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--portal-outer), var(--portal-mid), var(--portal-inner), var(--portal-outer), var(--portal-mid), var(--portal-inner), var(--portal-outer));
      animation: ringRotate 3.5s linear infinite;
      mask: radial-gradient(circle, transparent calc(var(--portal-radius) - 4px), #000 calc(var(--portal-radius) - 1px), #000 calc(var(--portal-radius) + 18px), transparent calc(var(--portal-radius) + 22px));
      -webkit-mask: radial-gradient(circle, transparent calc(var(--portal-radius) - 4px), #000 calc(var(--portal-radius) - 1px), #000 calc(var(--portal-radius) + 18px), transparent calc(var(--portal-radius) + 22px));
    }
    @keyframes ringRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .ring-middle {
      width: calc(var(--portal-radius) * 2 + 12px);
      height: calc(var(--portal-radius) * 2 + 12px);
      border: 2px solid rgba(255,255,255,0.30);
      box-shadow: 0 0 14px rgba(179,71,234,0.5), 0 0 30px rgba(179,71,234,0.20), inset 0 0 14px rgba(255,45,133,0.25);
      z-index: 2;
      animation: middlePulse 2.5s ease-in-out infinite;
    }
    @keyframes middlePulse {
      0%, 100% { box-shadow: 0 0 14px rgba(179,71,234,0.5), 0 0 30px rgba(179,71,234,0.20); }
      50% { box-shadow: 0 0 22px rgba(179,71,234,0.75), 0 0 45px rgba(179,71,234,0.35); }
    }
    .ring-inner {
      width: calc(var(--portal-radius) * 2 - 4px);
      height: calc(var(--portal-radius) * 2 - 4px);
      border: 1.5px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 8px rgba(0,229,255,0.35);
      z-index: 3;
    }
    .ring-dash {
      width: calc(var(--portal-radius) * 2 + 36px);
      height: calc(var(--portal-radius) * 2 + 36px);
      border: 2px dashed rgba(0,229,255,0.30);
      z-index: 0;
      animation: dashRotate 8s linear infinite reverse;
    }
    @keyframes dashRotate { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(-360deg); } }

    .energy-pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--portal-radius) * 2);
      height: calc(var(--portal-radius) * 2);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      border: 2px solid rgba(255,45,133,0.35);
      z-index: 0;
      animation: pulseExpand 3s ease-out infinite;
      opacity: 0;
    }
    .pulse-1 { animation-delay: 0s; }
    .pulse-2 { animation-delay: 1s; }
    .pulse-3 { animation-delay: 2s; }
    @keyframes pulseExpand {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
    }
    .portal-spark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3.5px;
      height: 3.5px;
      background: #fff;
      border-radius: 50%;
      z-index: 5;
      animation: sparkOrbit 4s linear infinite;
      box-shadow: 0 0 8px 3px var(--neon-cyan), 0 0 16px 6px var(--neon-cyan);
    }
    .s1 { animation-duration: 3.4s; animation-delay: 0s; }
    .s2 { animation-duration: 4.0s; animation-delay: 0.7s; }
    .s3 { animation-duration: 3.6s; animation-delay: 1.4s; }
    .s4 { animation-duration: 4.4s; animation-delay: 2.1s; }
    @keyframes sparkOrbit {
      0% { transform: translate(-50%, -50%) rotate(0deg) translateX(calc(var(--portal-radius) + 22px)) rotate(0deg); opacity: 1; }
      50% { opacity: 0.3; }
      100% { transform: translate(-50%, -50%) rotate(360deg) translateX(calc(var(--portal-radius) + 22px)) rotate(-360deg); opacity: 1; }
    }

    /* cursor trail */
    .cursor-trail {
      position: absolute;
      top: 0;
      left: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9;
      background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(179,71,234,0.12) 30%, transparent 70%);
      transform: translate(calc(var(--cursor-x) - 24px), calc(var(--cursor-y) - 24px));
      opacity: var(--trail-opacity);
      transition: opacity 0.3s;
      box-shadow: 0 0 40px 20px rgba(179,71,234,0.15), 0 0 80px 30px rgba(0,229,255,0.06);
      will-change: transform, opacity;
    }

    /* ----- UI overlay ----- */
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      opacity: 0;
      visibility: hidden;
    }
    .ui-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .ui-modal {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(1.3);
      -webkit-backdrop-filter: blur(28px) saturate(1.3);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 28px 32px 32px;
      max-width: 540px;
      width: 92%;
      box-shadow: var(--glass-shadow), 0 0 60px rgba(179,71,234,0.08);
      text-align: center;
      transform: scale(0.92) translateY(18px);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      opacity: 0;
      pointer-events: none;
      position: relative;
    }
    .ui-overlay.active .ui-modal {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .ui-modal .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: rgba(255,255,255,0.06);
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 30px;
      transition: all 0.25s;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      line-height: 1.4;
    }
    .ui-modal .close-btn:hover {
      background: rgba(255,255,255,0.14);
      color: #fff;
      box-shadow: 0 0 20px rgba(0,229,255,0.15);
    }
    .ui-modal .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--neon-cyan);
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.20);
      border-radius: 20px;
      padding: 3px 14px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .ui-modal h1 {
      font-family: 'Syncopate', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 4px 0 6px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 12px;
    }
    .ui-modal h1 .dim {
      color: #e8e0d8;
      text-shadow: 0 0 24px rgba(255,200,140,0.30);
    }
    .ui-modal h1 .portal-text {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple), var(--neon-cyan));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(255,45,133,0.40));
    }
    .ui-modal .sub {
      font-size: 0.9rem;
      color: rgba(220,220,245,0.65);
      margin: 2px 0 10px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }
    .ui-modal .hint-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: rgba(200,200,225,0.45);
      margin: 2px 0 16px;
      letter-spacing: 0.5px;
    }
    .ui-modal .hint-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--neon-cyan);
      animation: hintBlink 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes hintBlink {
      0%, 100% { opacity: 0.35; box-shadow: 0 0 4px var(--neon-cyan); }
      50% { opacity: 1; box-shadow: 0 0 14px var(--neon-cyan); }
    }
    .ui-modal .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .ui-modal .controls button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 7px 18px;
      border-radius: 30px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    .ui-modal .controls button:hover {
      background: rgba(255,255,255,0.12);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0,229,255,0.25);
      transform: translateY(-1px);
    }
    .ui-modal .controls button.active {
      background: rgba(0,229,255,0.12);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 24px rgba(0,229,255,0.15);
    }
    .ui-modal .controls button:active { transform: scale(0.96); }

    /* UI toggle button */
    .ui-toggle {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 99;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 40px;
      padding: 8px 18px 8px 16px;
      color: rgba(255,255,255,0.7);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      pointer-events: auto;
    }
    .ui-toggle:hover {
      background: rgba(20,20,50,0.75);
      border-color: rgba(0,229,255,0.25);
      color: #fff;
      box-shadow: 0 4px 32px rgba(0,0,0,0.5), 0 0 24px rgba(0,229,255,0.06);
    }
    .ui-toggle .toggle-icon {
      font-size: 1.1rem;
      line-height: 1;
      transition: transform 0.4s ease;
    }
    .ui-toggle .toggle-icon.open { transform: rotate(180deg); }

    /* ----- mode classes ----- */
    .mode-pulse .portal-ring { animation: portalPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes portalPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }
    .mode-glitch .layer {
      animation: chromaticGlitch 0.28s infinite;
    }
    @keyframes chromaticGlitch {
      0% { filter: drop-shadow(4px 0px 0px rgba(255,0,0,0.4)) drop-shadow(-4px 0px 0px rgba(0,255,255,0.4)); transform: translate(1px, -1px); }
      50% { filter: drop-shadow(-4px 0px 0px rgba(255,0,0,0.4)) drop-shadow(4px 0px 0px rgba(0,255,255,0.4)); transform: translate(-1px, 1px); }
      100% { filter: drop-shadow(2px 0px 0px rgba(255,0,0,0.4)) drop-shadow(-2px 0px 0px rgba(0,255,255,0.4)); transform: translate(0, 0); }
    }
    .split-mode #portalLens { display: none; }
    .split-mode .portal-decor { display: none; }
    .split-mode .cursor-trail { display: none; }
    .split-mode .divider {
      box-shadow: 0 0 20px rgba(200,200,240,0.5);
      width: 3px;
      background: linear-gradient(180deg, transparent, rgba(255,45,133,0.30), rgba(0,229,255,0.30), rgba(179,71,234,0.30), transparent);
    }

    /* responsive */
    @media (max-width: 768px) {
      .ui-modal { padding: 22px 20px 24px; border-radius: 20px; }
      .ui-modal .sub { font-size: 0.75rem; }
      .ui-modal .hint-row { font-size: 0.6rem; }
      .ui-modal .controls button { padding: 5px 12px; font-size: 0.7rem; }
      .ui-toggle { bottom: 14px; right: 14px; padding: 6px 14px 6px 12px; font-size: 0.65rem; }
      .sun { width: 56px; height: 56px; top: 14%; left: 30%; }
      .moon { width: 38px; height: 38px; top: 13%; right: 20%; }
      .cursor-trail { width: 34px; height: 34px; transform: translate(calc(var(--cursor-x) - 17px), calc(var(--cursor-y) - 17px)); }
      .clouds .cloud { transform: scale(0.8); transform-origin: center; }
    }
    @media (max-width: 480px) {
      .ui-modal { padding: 18px 14px 20px; border-radius: 16px; }
      .ui-modal h1 { font-size: clamp(1rem, 4.5vw, 1.3rem); gap: 4px 8px; }
      .ui-modal .badge { font-size: 0.55rem; padding: 2px 10px; }
      .ui-modal .sub { font-size: 0.65rem; }
      .ui-modal .hint-row { display: none; }
      .ui-modal .controls button { padding: 4px 10px; font-size: 0.6rem; letter-spacing: 0.4px; }
      .ui-toggle { bottom: 10px; right: 10px; padding: 5px 10px 5px 8px; font-size: 0.6rem; border-radius: 30px; }
      .ui-toggle .toggle-icon { font-size: 0.9rem; }
      .sun { width: 40px; height: 40px; top: 16%; }
      .moon { width: 28px; height: 28px; top: 15%; }
      .cursor-trail { width: 26px; height: 26px; transform: translate(calc(var(--cursor-x) - 13px), calc(var(--cursor-y) - 13px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring-glow-rotate, .ring-dash, .energy-pulse, .portal-spark, .cloud, .rain-drop, .sun, .moon, .particles-day, .stars-layer, .portal-ring {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .ui-overlay.active .ui-modal { transition-duration: 0.01ms !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
</head>
<body>

        <div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div>

        <div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div>

  <!-- portal decoration -->

<!-- UI overlay -->
<div class="ui-overlay active" id="uiOverlay">

    <button class="close-btn" id="closeModal" aria-label="Close">✕</button>

      <span class="dim">CYBERPUNK</span>
      <span class="portal-text">PORTALS</span>
    </h1>
    <p class="sub">Two Dimensions. One Gateway. Infinite Possibilities.</p>
    <div class="hint-row">
      <span class="hint-dot"></span> Move your cursor to explore both worlds
    </div>
    <div class="controls">
      <button id="btn-pulse">Pulse Core</button>
      <button id="btn-glitch">System Glitch</button>
      <button id="btn-split">Split View</button>

<button class="ui-toggle" id="uiToggle" aria-label="Toggle UI">
  <span class="toggle-icon" id="toggleIcon">⌃</span>
  <span id="toggleLabel">Hide Controls</span>
</button>

<script>
  (function() {
    'use strict';

    const root = document.documentElement;
    const universe = document.getElementById('universe');
    const portalLens = document.getElementById('portalLens');
    const portalDecor = document.getElementById('portalDecor');
    const cursorTrail = document.getElementById('cursorTrail');
    const uiOverlay = document.getElementById('uiOverlay');
    const closeModal = document.getElementById('closeModal');
    const uiToggle = document.getElementById('uiToggle');
    const toggleIcon = document.getElementById('toggleIcon');
    const toggleLabel = document.getElementById('toggleLabel');
    const btnPulse = document.getElementById('btn-pulse');
    const btnGlitch = document.getElementById('btn-glitch');
    const btnSplit = document.getElementById('btn-split');

    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let currentX = targetX;
    let currentY = targetY;
    let portalRadius = parseFloat(getComputedStyle(root).getPropertyValue('--portal-radius').trim()) || 170;
    let isPointerOnScreen = false;
    let animationId = null;
    let uiVisible = true;
    const LERP_FACTOR = 0.12;

    function lerp(start, end, factor) {
      return start + (end - start) * factor;
    }

    function updatePortalPosition(x, y) {
      const clampedX = Math.max(portalRadius, Math.min(window.innerWidth - portalRadius, x));
      const clampedY = Math.max(portalRadius, Math.min(window.innerHeight - portalRadius, y));

      root.style.setProperty('--portal-x', clampedX + 'px');
      root.style.setProperty('--portal-y', clampedY + 'px');
      root.style.setProperty('--cursor-x', x + 'px');
      root.style.setProperty('--cursor-y', y + 'px');

      const parallaxX = (clampedX - window.innerWidth / 2) * 0.03;
      const parallaxY = (clampedY - window.innerHeight / 2) * 0.03;
      root.style.setProperty('--parallax-x', parallaxX + 'px');
      root.style.setProperty('--parallax-y', parallaxY + 'px');
    }

    function animate() {
      currentX = lerp(currentX, targetX, LERP_FACTOR);
      currentY = lerp(currentY, targetY, LERP_FACTOR);
      updatePortalPosition(currentX, currentY);

      root.style.setProperty('--trail-opacity', isPointerOnScreen ? '1' : '0');

      animationId = requestAnimationFrame(animate);
    }

    function handleMouseMove(e) {
      targetX = e.clientX;
      targetY = e.clientY;
      isPointerOnScreen = true;
    }

    function handleMouseLeave() {
      isPointerOnScreen = false;
      targetX = window.innerWidth / 2;
      targetY = window.innerHeight / 2;
    }

    function handleMouseEnter() {
      isPointerOnScreen = true;
    }

    function handleTouchMove(e) {
      if (e.touches.length > 0) {
        targetX = e.touches[0].clientX;
        targetY = e.touches[0].clientY;
        isPointerOnScreen = true;
      }
    }

    function handleTouchEnd() {
      isPointerOnScreen = false;
      targetX = window.innerWidth / 2;
      targetY = window.innerHeight / 2;
    }

    function handleResize() {
      portalRadius = parseFloat(getComputedStyle(root).getPropertyValue('--portal-radius').trim()) || 170;
      targetX = Math.min(Math.max(targetX, portalRadius), window.innerWidth - portalRadius);
      targetY = Math.min(Math.max(targetY, portalRadius), window.innerHeight - portalRadius);
      currentX = targetX;
      currentY = targetY;
      updatePortalPosition(currentX, currentY);
    }

    function setMode(mode) {
      universe.classList.remove('mode-pulse', 'mode-glitch', 'split-mode');
      btnPulse.classList.remove('active');
      btnGlitch.classList.remove('active');
      btnSplit.classList.remove('active');

      if (mode === 'pulse') {
        universe.classList.add('mode-pulse');
        btnPulse.classList.add('active');
      } else if (mode === 'glitch') {
        universe.classList.add('mode-glitch');
        btnGlitch.classList.add('active');
      } else if (mode === 'split') {
        universe.classList.add('split-mode');
        btnSplit.classList.add('active');
      }
    }

    function toggleUI(show) {
      uiVisible = (show !== undefined) ? show : !uiVisible;
      if (uiVisible) {
        uiOverlay.classList.add('active');
        toggleIcon.classList.remove('open');
        toggleLabel.textContent = 'Hide Controls';
      } else {
        uiOverlay.classList.remove('active');
        toggleIcon.classList.add('open');
        toggleLabel.textContent = 'Show Controls';
      }
    }

    function init() {
      currentX = window.innerWidth / 2;
      currentY = window.innerHeight / 2;
      targetX = currentX;
      targetY = currentY;
      updatePortalPosition(currentX, currentY);

      // show UI after brief delay
      setTimeout(() => {
        uiOverlay.classList.add('active');
      }, 120);

      document.addEventListener('mousemove', handleMouseMove, { passive: true });
      document.addEventListener('mouseleave', handleMouseLeave);
      document.addEventListener('mouseenter', handleMouseEnter);
      document.addEventListener('touchmove', handleTouchMove, { passive: true });
      document.addEventListener('touchend', handleTouchEnd);
      document.addEventListener('touchcancel', handleTouchEnd);
      window.addEventListener('resize', handleResize);

      closeModal.addEventListener('click', () => toggleUI(false));
      uiToggle.addEventListener('click', () => toggleUI());

      btnPulse.addEventListener('click', () => setMode('pulse'));
      btnGlitch.addEventListener('click', () => setMode('glitch'));
      btnSplit.addEventListener('click', () => setMode('split'));

      animate();

      console.log('%c🌀 Cyberpunk Portals %cEnhanced · v2.0', 'color:#ff2d85; font-size:1.3em;', 'color:#00e5ff; font-size:1.3em;');
      console.log('%c   Two Dimensions · Cinematic Depth · Glass UI', 'color:#b347ea;');
      console.log('%c   Move your cursor · Toggle UI with the bottom‑right button', 'color:rgba(255,255,255,0.5);');
    }

    // cleanup
    window._cyberpunkPortalsCleanup = function() {
      if (animationId) cancelAnimationFrame(animationId);
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseleave', handleMouseLeave);
      document.removeEventListener('mouseenter', handleMouseEnter);
      document.removeEventListener('touchmove', handleTouchMove);
      document.removeEventListener('touchend', handleTouchEnd);
      document.removeEventListener('touchcancel', handleTouchEnd);
      window.removeEventListener('resize', handleResize);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>

</body>
